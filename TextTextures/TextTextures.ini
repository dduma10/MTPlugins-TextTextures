; Text Textures settings. Keep this file next to TextTextures.dll. The pane writes most of these for you.

[output]
; Material asset name; the image asset is i_<name>.
name=mus_creds_full
; GDT that receives the image + material entries (created if missing). Empty = <BO3>\source_data\text_textures.gdt
gdt=
; Folder for the PNGs, inside the BO3 folder (the GDT names images relative to it, like Treyarch's do).
image_folder=texture_assets\text_textures

[texture]
; Radiant texture browser category for new materials. Empty = "interior wall" for solid signs, "decal" otherwise.
; Treyarch's categories: background, ceiling, clip, decal, door, exterior trim, exterior wall, floor, foliage,
; interior trim, interior wall, roof, sky, terrain, tools, water, window
usage=
width=1024
height=512
kind=1
glow=0
glow_brightness=8
surface=plastic

[sign]
; Place sign: distance in front of the camera, plate thickness and the material on its back and edges (world units).
distance=96
thickness=2
back_material=caulk
apply_mode=1
apply_after_create=1
width=10

[model]
; 3D text: folder under model_export for the .xmodel_export/.xmodel_bin files.
folder=text_models
; Distance in front of the camera when placing a new model (world units).
distance=160
; Curve detail: outline points closer than this to a straight line are dropped, in tenths of a pixel of a 512 px
; font (6 = 0.6 px). Lower = smoother curves and more triangles.
detail_tolerance_x10=6
; 1 = delete the .xmodel_export after export2bin compiled it.
clean_exports=0
line_height=32
depth=4
side_color=#000000
front_material=
side_material=
back_face=0
collision=1
snap=1
pivot=0
place=0

[radiant]
; After creating a texture, ask Radiant's 3D camera to reload its assets (only on the Steam Radiant build it knows).
camera_asset_reload=1

[ui]
; 1 = multi-line text box (reads Radiant's Qt directly), 0 = single line where \n starts a new line.
multiline_text_box=1
[pane]
placed=1
[style]
text=Carrabella - Killstreak scripts base, PaP weapon variants, wonderweapon scripts, assets\nRonan - MW2 HUD, MW2 Perk Shaders\nTheSkyeLord - Base MW2 Weapons\nMoiCestTom - Zombie Rigging\nKilljoy - Boss Zombie Rigging\nMadgaz - Mapping (prefab), Assets\nNastian - Mapping (prefab)\nHiMMA - Mapping (prefab)\nMikeyRay - PHD Flopper\nSphynx- Console commands, zombie outlines\nFrostIceForge - Code Door base script\nLogical - Material/Model assets\nKingSlayerKyle - End Game Menu\nWetEgg - T8 Rayguns\nDtzXporter - Tools/Guides\nScobabula - Tools\nLaggmonster, MFD, BikDikCedrik - Testing/Bug finding                        
font=BankGothic
auto_fit=1
size=105
bold=0
italic=0
underline=0
align=1
valign=1
padding=25
outline=0
text_color=#FFFFFF
outline_color=#000000
background_color=#1E3A5F
transparent=1
[map]
winding=1
face_suffix=0 lightmap_gray 16384 16384 -216 -392 0 0
